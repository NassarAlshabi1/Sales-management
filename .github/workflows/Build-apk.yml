name: Flutter Build ARM64 APK

on:
  push:
    branches: [ Sales ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      # 🔥 AUTO FIX ANDROID ERRORS
      - name: Fix Android Config Automatically
        run: |
          sed -i 's/compileSdk = 35/compileSdk = 36/g' android/app/build.gradle.kts
          sed -i 's/targetSdk = 35/targetSdk = 36/g' android/app/build.gradle.kts
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/g' android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/xml
          echo '<?xml version="1.0" encoding="utf-8"?><full-backup-content/>' > android/app/src/main/res/xml/backup_rules.xml

      - name: Build ARM64 APK
        run: flutter build apk --target-platform android-arm64 --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arm64-apk
          path: build/app/outputs/flutter-apk/app-release.apk
