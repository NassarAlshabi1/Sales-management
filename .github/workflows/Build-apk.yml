name: Flutter Build ARM64 APK

on:
  push:
    branches: [ Sales ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build ARM64 APK
        run: flutter build apk --target-platform android-arm64 --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arm64-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      # بناء APK ARM64 فقط (بدون ABI split)
      - name: Build APK ARM64 Only
        run: flutter build apk --target-platform android-arm64 --release

      # رفع الملف الناتج
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
