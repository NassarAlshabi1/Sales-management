name: Flutter Build ARM64 APK

on:
  push:
    branches: [ Sales ]
  pull_request:
    branches: [ Sales ]
  workflow_dispatch:

jobs:
  build:
    name: Build ARM64 APK
    runs-on: ubuntu-latest

    steps:
      # تحميل المشروع
      - name: Checkout code
        uses: actions/checkout@v4

      # تثبيت Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # تثبيت Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: 'stable'

      # تحميل الحزم
      - name: Get dependencies
        run: flutter pub get

      # بناء APK ARM64 فقط (بدون ABI split)
      - name: Build APK ARM64 Only
        run: flutter build apk --target-platform android-arm64 --release

      # رفع الملف الناتج
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
